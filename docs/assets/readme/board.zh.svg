<svg xmlns="http://www.w3.org/2000/svg" width="880" height="640" viewBox="0 0 880 640" role="img" aria-label="长期陪伴与多个角色">
  <g font-family="Segoe UI, PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif">
    <rect x="0" y="0" width="428" height="300" rx="18" fill="#0d1b2e"/>
    <text x="24" y="40" fill="#f4efe4" font-size="18">长期聊</text>
    <text x="24" y="64" fill="#8ea0b5" font-size="13">同一段对话，合上再打开还在</text>
    <rect x="24" y="88" width="132" height="40" rx="12" fill="#1b3352"/>
    <text x="40" y="114" fill="#f4efe4" font-size="15">还在。</text>
    <rect x="196" y="140" width="208" height="40" rx="12" fill="#3d321c"/>
    <text x="212" y="166" fill="#f6e7c8" font-size="15">我回来了。</text>
    <rect x="24" y="192" width="150" height="40" rx="12" fill="#1b3352"/>
    <text x="40" y="218" fill="#f4efe4" font-size="15">接着说。</text>
    <text x="24" y="268" fill="#e7b56a" font-size="13">星梨</text>

    <rect x="452" y="0" width="428" height="300" rx="18" fill="#0d1b2e"/>
    <text x="476" y="40" fill="#f4efe4" font-size="18">多个角色</text>
    <text x="476" y="64" fill="#8ea0b5" font-size="13">点一下换人，记忆各自留着</text>
    <rect x="476" y="86" width="380" height="52" rx="12" fill="#1b3352"/>
    <circle cx="508" cy="112" r="14" fill="#e7b56a"/>
    <text x="532" y="118" fill="#f4efe4" font-size="15">星梨</text>
    <text x="790" y="118" fill="#e7b56a" font-size="13" text-anchor="end">当前</text>
    <rect x="476" y="148" width="380" height="52" rx="12" fill="#13263d"/>
    <circle cx="508" cy="174" r="14" fill="#31445f"/>
    <text x="532" y="180" fill="#d5deea" font-size="15">南风</text>
    <rect x="476" y="210" width="380" height="52" rx="12" fill="#13263d"/>
    <circle cx="508" cy="236" r="14" fill="#31445f"/>
    <text x="532" y="242" fill="#d5deea" font-size="15">晚照</text>

    <rect x="0" y="324" width="428" height="252" rx="18" fill="#0d1b2e"/>
    <text x="24" y="364" fill="#f4efe4" font-size="18">两个界面</text>
    <text x="24" y="388" fill="#8ea0b5" font-size="13">大屏 App，还有小手机</text>
    <rect x="36" y="416" width="230" height="128" rx="14" fill="#13263d" stroke="#243652"/>
    <rect x="52" y="432" width="120" height="10" rx="5" fill="#e7b56a"/>
    <rect x="52" y="454" width="186" height="8" rx="4" fill="#243652"/>
    <rect x="52" y="470" width="150" height="8" rx="4" fill="#243652"/>
    <rect x="52" y="486" width="168" height="8" rx="4" fill="#243652"/>
    <text x="52" y="526" fill="#8ea0b5" font-size="12">App</text>
    <rect x="286" y="416" width="110" height="128" rx="16" fill="#13263d" stroke="#243652"/>
    <rect x="304" y="432" width="74" height="70" rx="10" fill="#1b3352"/>
    <rect x="318" y="446" width="18" height="18" rx="4" fill="#e7b56a"/>
    <rect x="342" y="446" width="18" height="18" rx="4" fill="#31445f"/>
    <rect x="318" y="470" width="18" height="18" rx="4" fill="#31445f"/>
    <rect x="342" y="470" width="18" height="18" rx="4" fill="#31445f"/>
    <text x="318" y="526" fill="#8ea0b5" font-size="12">小手机</text>

    <rect x="452" y="324" width="428" height="252" rx="18" fill="#0d1b2e"/>
    <text x="476" y="364" fill="#f4efe4" font-size="18">自己的接口</text>
    <text x="476" y="388" fill="#8ea0b5" font-size="13">密钥留在这台设备上</text>
    <rect x="476" y="408" width="380" height="36" rx="8" fill="#13263d"/>
    <text x="490" y="432" fill="#8ea0b5" font-size="13">地址</text>
    <text x="540" y="432" fill="#d5deea" font-size="13">https://你的接口</text>
    <rect x="476" y="452" width="380" height="36" rx="8" fill="#13263d"/>
    <text x="490" y="476" fill="#8ea0b5" font-size="13">密钥</text>
    <text x="540" y="476" fill="#e7b56a" font-size="14">••••••••</text>
    <rect x="476" y="496" width="380" height="36" rx="8" fill="#13263d"/>
    <text x="490" y="520" fill="#8ea0b5" font-size="13">模型</text>
    <text x="540" y="520" fill="#d5deea" font-size="13">你来填</text>
  </g>
</svg>
