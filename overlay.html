<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>月栖悬浮陪伴</title>
    <link rel="stylesheet" href="/src/avatar/sprite-character.css" />
    <link rel="stylesheet" href="/src/avatar/bubble-character.css" />
    <style>
      :root {
        --pet-ink: #25343a;
        --pet-muted: #68767a;
        --pet-line: rgba(44, 65, 70, 0.14);
        --pet-surface: rgba(252, 254, 252, 0.96);
        --pet-mint: #4d9187;
        --pet-coral: #e47768;
        --pet-yellow: #efc85a;
      }

      * { box-sizing: border-box; }

      html,
      body {
        margin: 0;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
        color: var(--pet-ink);
        background: transparent;
        font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        user-select: none;
        -webkit-user-select: none;
      }

      button,
      input { font: inherit; }

      button { -webkit-tap-highlight-color: transparent; }

      #root {
        display: inline-grid;
        grid-template-columns: minmax(0, auto);
        justify-items: end;
        gap: 7px;
        padding: 0;
        max-width: min(96vw, 390px);
        background: transparent;
      }

      .pet-bubble {
        position: relative;
        display: none;
        width: min(254px, calc(100vw - 12px));
        padding: 10px 13px;
        border: 1px solid var(--pet-line);
        border-radius: 8px;
        color: var(--pet-ink);
        background: var(--pet-surface);
        box-shadow: 0 14px 32px rgba(35, 52, 57, 0.17);
        font-size: 13px;
        line-height: 1.45;
        text-align: left;
        animation: pet-bubble-in 180ms ease-out;
      }

      .pet-bubble::after {
        content: "";
        position: absolute;
        right: 30px;
        bottom: -6px;
        width: 11px;
        height: 11px;
        border-right: 1px solid var(--pet-line);
        border-bottom: 1px solid var(--pet-line);
        background: var(--pet-surface);
        transform: rotate(45deg);
      }

      body[data-mode="bubble"] .pet-bubble { display: block; }

      .pet-chat {
        display: none;
        width: min(360px, calc(100vw - 8px));
        overflow: hidden;
        border: 1px solid var(--pet-line);
        border-radius: 8px;
        background: var(--pet-surface);
        box-shadow: 0 22px 48px rgba(35, 52, 57, 0.2);
        animation: pet-panel-in 180ms ease-out;
      }

      body[data-mode="chat"] .pet-chat { display: block; }

      .pet-chat__header {
        display: flex;
        align-items: center;
        gap: 9px;
        min-height: 48px;
        padding: 8px 9px 8px 12px;
        border-bottom: 1px solid var(--pet-line);
      }

      .pet-chat__presence {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #45a879;
        box-shadow: 0 0 0 4px rgba(69, 168, 121, 0.13);
      }

      .pet-chat__identity {
        min-width: 0;
        margin-right: auto;
      }

      .pet-chat__identity strong,
      .pet-chat__identity span {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .pet-chat__identity strong { font-size: 13px; }
      .pet-chat__identity span { margin-top: 2px; color: var(--pet-muted); font-size: 10px; }

      .pet-pose-panel {
        display: none;
        height: 250px;
        overflow: auto;
        padding: 10px;
        border-bottom: 1px solid var(--pet-line);
        background: #f7faf8;
        scrollbar-width: thin;
      }

      .pet-chat.is-choosing-pose .pet-pose-panel { display: block; }
      .pet-chat.is-choosing-pose .pet-companion-actions,
      .pet-chat.is-choosing-pose .pet-thread,
      .pet-chat.is-choosing-pose .pet-stickers,
      .pet-chat.is-choosing-pose .pet-composer { display: none; }

      .pet-pose-panel__top {
        position: sticky;
        top: -10px;
        z-index: 1;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: 8px;
        margin: -2px -2px 8px;
        padding: 2px 2px 8px;
        background: #f7faf8;
      }

      .pet-pose-panel__top strong {
        overflow: hidden;
        font-size: 12px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .pet-pose-modes {
        display: inline-grid;
        grid-template-columns: repeat(2, auto);
        padding: 2px;
        border: 1px solid var(--pet-line);
        border-radius: 7px;
        background: #fff;
      }

      .pet-pose-modes button {
        min-height: 27px;
        padding: 0 9px;
        border: 0;
        border-radius: 5px;
        color: var(--pet-muted);
        background: transparent;
        font-size: 11px;
        cursor: pointer;
      }

      .pet-pose-modes button.is-active {
        color: #fff;
        background: var(--pet-mint);
      }

      .pet-pose-group { margin-top: 9px; }

      .pet-pose-group > span {
        display: block;
        margin: 0 2px 5px;
        color: var(--pet-muted);
        font-size: 10px;
      }

      .pet-pose-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 5px;
      }

      .pet-pose-grid button {
        min-width: 0;
        min-height: 31px;
        padding: 5px 6px;
        overflow: hidden;
        border: 1px solid var(--pet-line);
        border-radius: 6px;
        color: var(--pet-ink);
        background: #fff;
        font-size: 11px;
        text-overflow: ellipsis;
        white-space: nowrap;
        cursor: pointer;
      }

      .pet-pose-grid button:hover,
      .pet-pose-grid button:focus-visible {
        border-color: rgba(77, 145, 135, 0.5);
        outline: none;
      }

      .pet-pose-grid button.is-active {
        border-color: var(--pet-mint);
        color: #27675f;
        background: #eaf6f2;
      }

      .icon-control {
        display: inline-grid;
        place-items: center;
        width: 32px;
        height: 32px;
        padding: 0;
        border: 0;
        border-radius: 6px;
        color: var(--pet-muted);
        background: transparent;
      }

      .icon-control:hover,
      .icon-control:focus-visible { color: var(--pet-ink); background: rgba(77, 145, 135, 0.1); }
      .icon-control:disabled {
        color: rgba(104, 118, 122, 0.45);
        background: transparent;
        cursor: not-allowed;
        opacity: 0.62;
      }
      .icon-control svg { width: 17px; height: 17px; }

      .pet-thread {
        display: flex;
        flex-direction: column;
        gap: 7px;
        height: 140px;
        padding: 12px;
        overflow: auto;
        scrollbar-width: none;
        background: #f7faf8;
      }

      .pet-thread::-webkit-scrollbar { display: none; }

      .pet-message {
        width: fit-content;
        max-width: 82%;
        padding: 8px 10px;
        border-radius: 8px;
        font-size: 12px;
        line-height: 1.42;
        user-select: text;
        -webkit-user-select: text;
      }

      .pet-message--ai {
        align-self: flex-start;
        border: 1px solid rgba(77, 145, 135, 0.12);
        background: #fff;
      }

      .pet-message--user {
        align-self: flex-end;
        color: #fff;
        background: var(--pet-mint);
      }

      .pet-stickers {
        display: none;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 6px;
        padding: 8px 10px;
        border-top: 1px solid var(--pet-line);
        background: #fff;
      }

      .pet-stickers.is-open { display: grid; }

      .pet-stickers button {
        min-height: 34px;
        border: 1px solid var(--pet-line);
        border-radius: 6px;
        background: #f5faf7;
        font-size: 18px;
      }

      .pet-composer {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: 6px;
        padding: 8px 10px 10px;
        border-top: 1px solid var(--pet-line);
        background: #fff;
      }

      .pet-composer input {
        width: 100%;
        min-width: 0;
        height: 34px;
        padding: 0 9px;
        border: 1px solid var(--pet-line);
        border-radius: 6px;
        outline: none;
        color: var(--pet-ink);
        background: #f8fbf9;
        font-size: 12px;
        user-select: text;
        -webkit-user-select: text;
      }

      .pet-composer input:focus {
        border-color: rgba(77, 145, 135, 0.55);
        box-shadow: 0 0 0 3px rgba(77, 145, 135, 0.1);
      }

      .pet-composer__send {
        color: #fff;
        background: var(--pet-mint);
      }

      .pet-composer__send:hover,
      .pet-composer__send:focus-visible { color: #fff; background: #397c74; }

      .pet-character-wrap {
        position: relative;
        display: grid;
        justify-items: end;
        width: var(--pet-width, 164px);
        height: var(--pet-height, 226px);
      }

      body[data-mode="chat"] .pet-character-wrap {
        width: 126px;
        height: 168px;
      }

      .pet-character-hit {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: end center;
        width: 100%;
        height: 100%;
        padding: 0;
        overflow: visible;
        border: 0;
        outline: none;
        background: transparent;
        cursor: grab;
        touch-action: none;
      }

      .pet-character-hit:active { cursor: grabbing; }

      #spriteMount {
        width: 100%;
        height: 100%;
        pointer-events: none;
        display: grid;
        place-items: end center;
      }

      #spriteMount .sprite-character {
        width: 100%;
        max-width: none;
      }

      .pet-character-hit.has-sprite #spriteMount { display: grid; }

      .pet-context-menu {
        position: fixed;
        z-index: 40;
        display: none;
        min-width: 168px;
        padding: 6px;
        border: 1px solid var(--pet-line);
        border-radius: 10px;
        background: var(--pet-surface);
        box-shadow: 0 16px 36px rgba(35, 52, 57, 0.2);
      }

      .pet-context-menu.is-open { display: grid; gap: 2px; }

      .pet-context-menu button {
        display: block;
        width: 100%;
        padding: 9px 12px;
        border: 0;
        border-radius: 7px;
        background: transparent;
        color: var(--pet-ink);
        text-align: left;
        font-size: 13px;
        cursor: pointer;
      }

      .pet-context-menu button:hover,
      .pet-context-menu button:focus-visible {
        background: rgba(77, 145, 135, 0.12);
        outline: none;
      }

      .pet-context-menu hr {
        margin: 4px 6px;
        border: 0;
        border-top: 1px solid var(--pet-line);
      }

      body[data-action="sleep_pose"] .pet-character-wrap::after {
        content: "Z z z";
        position: absolute;
        top: 4px;
        right: 18px;
        color: #8b7bb8;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.08em;
        pointer-events: none;
        animation: pet-zzz 1.6s ease-in-out infinite;
      }

      @keyframes pet-zzz {
        0%, 100% { opacity: 0.35; transform: translateY(0); }
        50% { opacity: 1; transform: translateY(-4px); }
      }

      .pet-badge {
        position: absolute;
        top: 8px;
        right: 4px;
        display: none;
        min-width: 18px;
        height: 18px;
        padding: 0 5px;
        border: 0;
        border-radius: 9px;
        color: #fff;
        background: var(--pet-coral);
        font-size: 10px;
        line-height: 18px;
        text-align: center;
        box-shadow: none;
      }

      .pet-badge.show { display: block; }

      /* Collapsed pet: no frosted chrome — only the body is visible */
      .pet-tools { display: none !important; }

      .pet-character-hit:focus-visible {
        filter: none;
        outline: 2px solid rgba(77, 145, 135, 0.55);
        outline-offset: 2px;
      }

      .pet-companion-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        padding: 10px 12px 0;
        background: transparent;
      }

      .pet-companion-action {
        display: grid;
        gap: 3px;
        justify-items: center;
        min-height: 58px;
        padding: 10px 8px;
        border: 1px solid var(--pet-line);
        border-radius: 10px;
        background: #fff;
        color: var(--pet-ink);
        cursor: pointer;
      }

      .pet-companion-action strong { font-size: 13px; }
      .pet-companion-action small {
        color: var(--pet-muted);
        font-size: 11px;
        line-height: 1.3;
      }

      .pet-companion-action.is-active {
        border-color: var(--pet-mint);
        background: #eef8f5;
      }

      .pet-companion-action[data-companion="screen"].is-active {
        border-color: var(--pet-coral);
        background: #fff4f1;
      }

      body[data-play="thinking"] .pet-chat__presence,
      body[data-play="capturing"] .pet-chat__presence { background: var(--pet-yellow); }
      body[data-play="listening"] .pet-chat__presence { background: var(--pet-coral); }
      body[data-play="talking"] .pet-chat__presence { animation: pet-presence-pulse 850ms ease-in-out infinite; }

      @keyframes pet-bubble-in {
        from { opacity: 0; transform: translateY(6px) scale(0.98); }
        to { opacity: 1; transform: none; }
      }

      @keyframes pet-panel-in {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: none; }
      }

      @keyframes pet-custom-idle {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-3px); }
      }

      @keyframes pet-presence-pulse {
        0%, 100% { box-shadow: 0 0 0 3px rgba(69, 168, 121, 0.12); }
        50% { box-shadow: 0 0 0 6px rgba(69, 168, 121, 0.04); }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important; }
      }
    </style>
  </head>
  <body data-mode="collapsed" data-play="idle">
    <div id="root">
      <button type="button" class="pet-bubble" id="bubble" aria-label="展开对话"></button>

      <section class="pet-chat" id="chat" aria-label="陪伴对话">
        <header class="pet-chat__header">
          <span class="pet-chat__presence" aria-hidden="true"></span>
          <div class="pet-chat__identity">
            <strong id="chatName">星梨</strong>
            <span id="chatStatus">点开就能聊</span>
          </div>
          <button type="button" class="icon-control" id="btnPoses" aria-label="选择动作" title="选择动作"><i data-lucide="sparkles"></i></button>
          <button type="button" class="icon-control" id="btnOpenApp" aria-label="打开 App" title="打开 App"><i data-lucide="maximize-2"></i></button>
          <button type="button" class="icon-control" id="btnCollapse" aria-label="收起" title="收起"><i data-lucide="chevron-down"></i></button>
          <button type="button" class="icon-control" id="btnClose" aria-label="关闭悬浮" title="关闭悬浮"><i data-lucide="x"></i></button>
        </header>
        <div class="pet-companion-actions" aria-label="陪伴方式">
          <button type="button" class="pet-companion-action" id="btnVoiceChat" data-companion="voice">
            <strong>语音聊天</strong>
            <small>按住说话，ta听你</small>
          </button>
          <button type="button" class="pet-companion-action" id="btnShareScreen" data-companion="screen">
            <strong>截帧读屏</strong>
            <small>定时看屏幕陪聊</small>
          </button>
        </div>
        <section class="pet-pose-panel" id="posePanel" aria-label="角色动作" hidden>
          <div class="pet-pose-panel__top">
            <strong id="poseNow">待机</strong>
            <div class="pet-pose-modes" role="group" aria-label="动作控制模式">
              <button type="button" data-pose-mode="auto" class="is-active" aria-pressed="true">自动跟随</button>
              <button type="button" data-pose-mode="manual" aria-pressed="false">手动选择</button>
            </div>
          </div>
          <div id="poseGroups"></div>
        </section>
        <div class="pet-thread" id="chatThread" aria-live="polite">
          <div class="pet-message pet-message--ai">我在。想语音聊，或把屏幕分享给我都行。</div>
        </div>
        <div class="pet-stickers" id="stickerPanel" aria-label="快捷表情" hidden></div>
        <form class="pet-composer" id="quickForm">
          <button type="button" class="icon-control" id="btnMic" aria-label="语音" title="语音" hidden><i data-lucide="mic"></i></button>
          <button type="button" class="icon-control" id="btnCapture" aria-label="截帧读屏" title="截帧读屏" hidden><i data-lucide="scan-eye"></i></button>
          <input id="quickInput" type="text" maxlength="1200" autocomplete="off" placeholder="也可以打字…" aria-label="消息" />
          <button type="submit" class="icon-control pet-composer__send" aria-label="发送" title="发送"><i data-lucide="arrow-up"></i></button>
        </form>
      </section>

      <div class="pet-character-wrap">
        <button type="button" class="pet-character-hit has-sprite" id="characterHit" aria-label="星梨，点开语音或截帧读屏">
          <span id="spriteMount"></span>
        </button>
        <span class="pet-badge" id="badge">0</span>
      </div>
    </div>
    <div class="pet-context-menu" id="petContextMenu" role="menu" hidden>
      <button type="button" role="menuitem" data-companion="voice">语音聊天</button>
      <button type="button" role="menuitem" data-companion="screen">截帧读屏</button>
      <button type="button" role="menuitem" data-pet-menu="poses">选择动作</button>
      <button type="button" role="menuitem" data-pet-menu="auto-pose">恢复自动跟随</button>
      <button type="button" role="menuitem" data-pet-action="greet">挥手问候</button>
      <button type="button" role="menuitem" data-pet-action="selfie">自拍一下</button>
      <button type="button" role="menuitem" data-pet-action="sleep_pose">进入睡眠</button>
      <hr />
      <button type="button" role="menuitem" data-pet-menu="open-app">打开月栖</button>
      <button type="button" role="menuitem" data-pet-menu="hide">隐藏</button>
      <button type="button" role="menuitem" data-pet-menu="quit">退出</button>
    </div>
    <script type="module" src="/src/overlay/overlay-app.js"></script>
  </body>
</html>
