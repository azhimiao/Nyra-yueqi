    <rect x="98" y="180" width="36" height="190"/>
    <rect x="148" y="230" width="70" height="140"/>
    <rect x="230" y="165" width="42" height="205"/>
    <rect x="286" y="200" width="58" height="170"/>
    <rect x="360" y="150" width="34" height="220"/>
    <rect x="410" y="190" width="80" height="180"/>
    <rect x="505" y="140" width="46" height="230"/>
    <rect x="565" y="205" width="62" height="165"/>
    <rect x="640" y="170" width="40" height="200"/>
    <rect x="695" y="220" width="70" height="150"/>
  </g>
