<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e2d3d"/>
      <stop offset="55%" stop-color="#101820"/>
      <stop offset="100%" stop-color="#070b10"/>
    </linearGradient>
    <radialGradient id="glow" cx="62%" cy="28%" r="42%">
      <stop offset="0%" stop-color="#c9a06a" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#6a8aaa" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="build" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#243444"/>
      <stop offset="100%" stop-color="#0a1016"/>
    </linearGradient>
  </defs>
  <rect width="800" height="480" fill="url(#sky)"/>
  <rect width="800" height="480" fill="url(#glow)"/>
  <!-- distant skyline -->
  <g fill="url(#build)" opacity="0.92">
